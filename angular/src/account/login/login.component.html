<div [@routerTransition]>
  <h2 class="fr-login-card__title">Welcome back</h2>
  <p class="fr-login-card__sub">Sign in to your account</p>

  <form novalidate autocomplete="off" #loginForm="ngForm" (ngSubmit)="login()">
    <div class="fr-login-field">
      <label class="fr-login-label">Username or Email</label>
      <div class="fr-login-input-wrap">
        <i class="fas fa-user fr-login-input-icon"></i>
        <input
          type="text"
          class="fr-login-input"
          name="userNameOrEmailAddress"
          [(ngModel)]="authService.authenticateModel.userNameOrEmailAddress"
          [placeholder]="'UserNameOrEmail' | localize"
          required
          maxlength="256"
          #userNameOrEmailAddressModel="ngModel"
          #userNameOrEmailAddressEl
        />
      </div>
      <abp-validation-summary
        [control]="userNameOrEmailAddressModel"
        [controlEl]="userNameOrEmailAddressEl"
      ></abp-validation-summary>
    </div>

    <div class="fr-login-field">
      <label class="fr-login-label">Password</label>
      <div class="fr-login-input-wrap">
        <i class="fas fa-lock fr-login-input-icon"></i>
        <input
          [type]="showPassword ? 'text' : 'password'"
          class="fr-login-input fr-login-input--has-toggle"
          name="password"
          [(ngModel)]="authService.authenticateModel.password"
          [placeholder]="'Password' | localize"
          required
          maxlength="32"
          #passwordModel="ngModel"
          #passwordEl
        />
        <button type="button" class="fr-login-eye" (click)="showPassword = !showPassword" tabindex="-1">
          <i class="fas" [class.fa-eye]="!showPassword" [class.fa-eye-slash]="showPassword"></i>
        </button>
      </div>
      <abp-validation-summary
        [control]="passwordModel"
        [controlEl]="passwordEl"
      ></abp-validation-summary>
    </div>

    <div class="fr-login-row">
      <label class="fr-login-remember">
        <input type="checkbox" name="rememberMe" [(ngModel)]="authService.rememberMe" />
        <span>{{ "RememberMe" | localize }}</span>
      </label>
    </div>

    <button
      type="submit"
      class="fr-login-btn"
      [disabled]="!loginForm.form.valid || submitting">
      <span *ngIf="!submitting">{{ "LogIn" | localize }}</span>
      <span *ngIf="submitting"><i class="fas fa-spinner fa-spin mr-1"></i>Signing in…</span>
    </button>
  </form>
</div>
