<form class="form-horizontal" autocomplete="off" #plantForm="ngForm" (ngSubmit)="save()">
  <abp-modal-header [title]="'PlantCropSeason' | localize" (onCloseClick)="bsModalRef.hide()"></abp-modal-header>
  <div class="modal-body">
    <div class="form-group row required">
      <label class="col-md-3 col-form-label">{{ "Field" | localize }}</label>
      <div class="col-md-9">
        <select class="form-control" name="field" required [(ngModel)]="input.fieldId">
          <option *ngFor="let f of fields" [value]="f.id">{{ f.name }}</option>
        </select>
      </div>
    </div>
    <div class="form-group row required">
      <label class="col-md-3 col-form-label">{{ "CropType" | localize }}</label>
      <div class="col-md-9">
        <select class="form-control" name="cropType" required [(ngModel)]="input.cropTypeId" (ngModelChange)="onCropTypeChange()">
          <option *ngFor="let c of cropTypes" [value]="c.id">{{ c.name }}</option>
        </select>
      </div>
    </div>
    <div class="form-group row">
      <label class="col-md-3 col-form-label">{{ "SeedVariety" | localize }}</label>
      <div class="col-md-9">
        <select class="form-control" name="seedVariety" [(ngModel)]="input.seedVarietyId">
          <option [value]="undefined">-</option>
          <option *ngFor="let v of filteredVarieties" [value]="v.id">{{ v.name }}</option>
        </select>
      </div>
    </div>
    <div class="form-group row required">
      <label class="col-md-3 col-form-label">{{ "PlantingDate" | localize }}</label>
      <div class="col-md-9">
        <input type="date" class="form-control" name="plantingDate" required [(ngModel)]="input.plantingDate" />
      </div>
    </div>
    <div class="form-group row required">
      <label class="col-md-3 col-form-label">{{ "ExpectedHarvestDate" | localize }}</label>
      <div class="col-md-9">
        <input type="date" class="form-control" name="expectedHarvestDate" required [(ngModel)]="input.expectedHarvestDate" />
      </div>
    </div>
    <div class="form-group row">
      <label class="col-md-3 col-form-label">{{ "ExpectedYieldKg" | localize }}</label>
      <div class="col-md-9">
        <input type="number" class="form-control" name="expectedYieldKg" min="0" step="0.1" [(ngModel)]="input.expectedYieldKg" />
      </div>
    </div>
    <div class="form-group row">
      <label class="col-md-3 col-form-label">{{ "PlantPopulationPerHectare" | localize }}</label>
      <div class="col-md-9">
        <input type="number" class="form-control" name="plantPopulation" min="1" [(ngModel)]="input.plantPopulationPerHectare" />
      </div>
    </div>
  </div>
  <abp-modal-footer [cancelDisabled]="saving" [saveDisabled]="!plantForm.form.valid || saving" (onCancelClick)="bsModalRef.hide()"></abp-modal-footer>
</form>
