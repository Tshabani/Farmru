<div [@routerTransition]>
  <section class="content-header pb-0">
    <div class="container-fluid">
      <div class="fr-page-header">
        <div>
          <h1 class="fr-page-title">{{ "AllAlerts" | localize }}</h1>
          <p class="fr-page-sub">View and manage all system alerts</p>
        </div>
      </div>
    </div>
  </section>

  <section class="content px-2 pt-3">
    <div class="container-fluid">
      <div class="fr-card">
        <div class="fr-card__body">
          <div class="table-responsive">
            <table class="fr-table" [busy]="isTableLoading">
              <thead>
                <tr>
                  <th>Severity</th>
                  <th>Title</th>
                  <th>Device</th>
                  <th>When</th>
                </tr>
              </thead>
              <tbody>
                <tr *ngFor="let a of alerts" class="cursor-pointer" (click)="open(a)">
                  <td>
                    <span class="fr-chip fr-chip-brand">{{ a.severity }}</span>
                  </td>
                  <td>{{ a.title }}</td>
                  <td>{{ a.node?.displayText }}</td>
                  <td>{{ a.triggeredAt | date:'short' }}</td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
        <div class="fr-card__footer">
          <span></span>
          <span class="fr-total">Total: <strong>{{ totalItems }}</strong></span>
          <abp-pagination-controls id="server" (pageChange)="getDataPage($event)"></abp-pagination-controls>
        </div>
      </div>
    </div>
  </section>
</div>
