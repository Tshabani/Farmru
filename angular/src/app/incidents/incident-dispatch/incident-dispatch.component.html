<div [@routerTransition]>
  <section class="content-header">
    <div class="container-fluid">
      <h1>{{ 'TechnicianDispatch' | localize }}</h1>
    </div>
  </section>
  <section class="content px-2" *ngIf="loading"><div class="text-center p-5"><i class="fas fa-spinner fa-spin"></i></div></section>
  <section class="content px-2" *ngIf="!loading">
    <div class="row">
      <div class="col-md-4">
        <div class="card">
          <div class="card-header">Unassigned / escalated</div>
          <ul class="list-group list-group-flush">
            <li class="list-group-item list-group-item-action" *ngFor="let i of incidents" (click)="select(i)" [class.active]="selected?.id === i.id">
              {{ i.title }}
            </li>
          </ul>
        </div>
      </div>
      <div class="col-md-8" *ngIf="selected">
        <div class="card">
          <div class="card-header">{{ selected.title }}</div>
          <div class="card-body">
            <input class="form-control mb-2" [(ngModel)]="teamName" placeholder="Team name" />
            <textarea class="form-control mb-2" [(ngModel)]="dispatchNotes" placeholder="Dispatch notes"></textarea>
            <table class="table table-sm">
              <thead><tr><th>Technician</th><th>Active</th><th>Distance (km)</th><th></th></tr></thead>
              <tbody>
                <tr *ngFor="let s of suggestions">
                  <td>{{ s.displayName }}</td>
                  <td>{{ s.activeIncidents }}</td>
                  <td>{{ s.distanceKm ?? '—' }}</td>
                  <td><button class="btn btn-xs btn-primary" (click)="assignSuggestion(s)">Assign</button></td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </section>
</div>
