<div [@routerTransition]>
  <section class="content-header pb-0">
    <div class="container-fluid">
      <div class="fr-page-header">
        <div>
          <h1 class="fr-page-title">{{ 'IncidentKanban' | localize }}</h1>
          <p class="fr-page-sub">Visual board - drag through statuses</p>
        </div>
        <div class="ml-auto d-flex align-items-center">
          <button class="fr-btn fr-btn-outline" routerLink="/app/incidents">Command center</button>
        </div>
      </div>
    </div>
  </section>

  <section class="content px-2 pt-3" *ngIf="loading">
    <div class="fr-loading"><i class="fas fa-spinner fa-spin fa-2x"></i></div>
  </section>

  <section class="content px-2 pt-3" *ngIf="!loading">
    <div class="container-fluid-full">
      <div class="fr-kanban">
        <div class="fr-kanban-col" *ngFor="let col of columns">
          <div class="fr-kanban-col__header">
            <span>{{ columnTitle(col.status) }}</span>
            <span class="fr-kanban-col__count">{{ col.items.length }}</span>
          </div>
          <div class="fr-kanban-col__body">
            <div class="fr-kanban-item" *ngFor="let item of col.items" (click)="open(item)">
              <div class="fr-kanban-item__title">{{ item.title }}</div>
              <div class="fr-kanban-item__sub">{{ item.facility?.displayText }}</div>
              <div class="mt-2" *ngIf="canManage && nextStatus(item.status) !== null">
                <button class="fr-btn fr-btn-outline fr-btn-sm" (click)="advance(item, nextStatus(item.status)!, $event)">
                  Advance
                </button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </section>
</div>
