<section class="content-header"><h1>{{ isEdit ? 'Edit' : 'Create' }} geo-fence</h1></section>
<section class="content px-2">
  <div class="card"><div class="card-body">
    <div class="form-group"><label>Name</label><input class="form-control" [(ngModel)]="model.name" /></div>
    <div class="form-group"><label>Type</label>
      <select class="form-control" [(ngModel)]="model.geoFenceType">
        <option [ngValue]="0">Radius</option>
        <option [ngValue]="1">Polygon (JSON)</option>
      </select>
    </div>
    <div *ngIf="model.geoFenceType === 0">
      <div class="form-group"><label>Center lat</label><input type="number" class="form-control" [(ngModel)]="model.centerLatitude" /></div>
      <div class="form-group"><label>Center lng</label><input type="number" class="form-control" [(ngModel)]="model.centerLongitude" /></div>
      <div class="form-group"><label>Radius (m)</label><input type="number" class="form-control" [(ngModel)]="model.radiusMeters" /></div>
    </div>
    <div *ngIf="model.geoFenceType === 1" class="form-group">
      <label>Polygon JSON</label>
      <textarea class="form-control" rows="4" [(ngModel)]="model.polygonJson"></textarea>
    </div>
    <div class="form-group"><label>Severity</label>
      <select class="form-control" [(ngModel)]="model.severity">
        <option [ngValue]="0">Info</option>
        <option [ngValue]="1">Warning</option>
        <option [ngValue]="2">Critical</option>
      </select>
    </div>
    <div class="form-check"><input type="checkbox" [(ngModel)]="model.isActive" /> Active</div>
    <button class="btn btn-secondary mt-3 mr-2" (click)="back()">Cancel</button>
    <button class="btn btn-primary mt-3" [disabled]="loading" (click)="save()">Save</button>
  </div></div>
</section>
