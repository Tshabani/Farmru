<div [@routerTransition] [busy]="isLoading">
  <section class="content-header pb-0">
    <div class="container-fluid">
      <div class="fr-page-header">
        <div>
          <h1 class="fr-page-title">{{ "HomePage" | localize }}</h1>
          <p class="fr-page-sub">FarmRu IoT Monitoring - official farm management dashboard</p>
        </div>
      </div>
    </div>
  </section>

  <section class="content px-2 pt-3">
    <div class="container-fluid">
      <div class="fr-stat-row">
        <div class="fr-stat fr-stat--secondary">
          <div class="fr-stat__icon"><i class="fas fa-shield-alt"></i></div>
          <div class="fr-stat__value">{{ stats.totalNumberOfRoles }}</div>
          <div class="fr-stat__label">Roles</div>
        </div>
        <div class="fr-stat fr-stat--info">
          <div class="fr-stat__icon"><i class="fas fa-users"></i></div>
          <div class="fr-stat__value">{{ stats.totalNumberOfUsers }}</div>
          <div class="fr-stat__label">Users</div>
        </div>
        <div class="fr-stat fr-stat--warning">
          <div class="fr-stat__icon"><i class="fas fa-microchip"></i></div>
          <div class="fr-stat__value">{{ stats.totalNumberOfNodes }}</div>
          <div class="fr-stat__label">Total Nodes</div>
        </div>
        <div class="fr-stat fr-stat--success">
          <div class="fr-stat__icon"><i class="fas fa-signal"></i></div>
          <div class="fr-stat__value">{{ stats.totalNumberOfActiveNodes }}</div>
          <div class="fr-stat__label">Active Nodes</div>
        </div>
      </div>

      <app-agricultural-dashboard [readingsData]="historicalData"></app-agricultural-dashboard>
    </div>
  </section>
</div>
