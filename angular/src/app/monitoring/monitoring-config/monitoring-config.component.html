<section class="content-header"><h1>{{ "MonitoringConfiguration" | localize }}</h1></section>
<section class="content px-2" *ngIf="loading"><div class="text-center p-5"><i class="fas fa-spinner fa-spin"></i></div></section>
<section class="content px-2" *ngIf="!loading && config">
  <div class="card">
    <div class="card-body">
      <div class="form-group">
        <label>{{ "MonitoringEnabled" | localize }}</label>
        <input type="checkbox" [(ngModel)]="config.monitoringEnabled" />
      </div>
      <div class="form-group">
        <label>{{ "OfflineDevices" | localize }} timeout (min)</label>
        <input type="number" class="form-control" [(ngModel)]="config.offlineTimeoutMinutes" />
      </div>
      <div class="form-group">
        <label>{{ "StaleTelemetryThresholdMinutes" | localize }}</label>
        <input type="number" class="form-control" [(ngModel)]="config.staleTelemetryThresholdMinutes" />
      </div>
      <div class="form-group">
        <label>{{ "EscalationTimeoutMinutes" | localize }}</label>
        <input type="number" class="form-control" [(ngModel)]="config.escalationTimeoutMinutes" />
      </div>
      <div class="form-group">
        <label>{{ "AnomalySensitivityPercent" | localize }}</label>
        <input type="number" class="form-control" [(ngModel)]="config.anomalySensitivityPercent" />
      </div>
      <div class="form-group">
        <label>Min battery %</label>
        <input type="number" class="form-control" [(ngModel)]="config.minimumBatteryPercent" />
      </div>
      <div class="form-group">
        <label>Critical battery %</label>
        <input type="number" class="form-control" [(ngModel)]="config.criticalBatteryPercent" />
      </div>
      <button class="btn btn-secondary mr-2" (click)="back()">{{ "Back" | localize }}</button>
      <button class="btn btn-primary" [disabled]="saving" (click)="save()">{{ "Save" | localize }}</button>
    </div>
  </div>
</section>
