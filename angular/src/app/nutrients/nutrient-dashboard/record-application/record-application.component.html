<form class="form-horizontal" autocomplete="off" #appForm="ngForm" (ngSubmit)="save()">
  <abp-modal-header [title]="'RecordFertilizerApplication' | localize" (onCloseClick)="bsModalRef.hide()"></abp-modal-header>
  <div class="modal-body">
    <div class="form-group row required">
      <label class="col-md-3 col-form-label">{{ "FertilizerProduct" | localize }}</label>
      <div class="col-md-9">
        <select class="form-control" name="product" required [(ngModel)]="input.productId">
          <option *ngFor="let p of products" [value]="p.id">{{ p.name }}</option>
        </select>
      </div>
    </div>
    <div class="form-group row required">
      <label class="col-md-3 col-form-label">{{ "RateKgPerHectare" | localize }}</label>
      <div class="col-md-9">
        <input type="number" class="form-control" name="rate" required min="0.01" step="0.1" [(ngModel)]="input.rateKgPerHectare" />
      </div>
    </div>
    <div class="form-group row required">
      <label class="col-md-3 col-form-label">{{ "ApplicationDate" | localize }}</label>
      <div class="col-md-9">
        <input type="date" class="form-control" name="applicationDate" required [(ngModel)]="input.applicationDate" />
      </div>
    </div>
    <div class="form-group row">
      <label class="col-md-3 col-form-label">{{ "Cost" | localize }}</label>
      <div class="col-md-9">
        <input type="number" class="form-control" name="cost" min="0" step="0.01" [(ngModel)]="input.cost" />
      </div>
    </div>
  </div>
  <abp-modal-footer [cancelDisabled]="saving" [saveDisabled]="!appForm.form.valid || saving" (onCancelClick)="bsModalRef.hide()"></abp-modal-footer>
</form>
